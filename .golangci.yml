version: "2"
linters:
  enable:
    - bodyclose
    - contextcheck
    - exhaustruct
    - gosec
    - nilerr
    - revive
  settings:
    exhaustruct:
      exclude:
        - archive/zip\.FileHeader
        - net/http\.Server
    gosec:
      excludes:
        - G304 # file path from variable — acceptable in this service
        - G204 # subprocess args are internally controlled
        - G115 # int32 casts are intentional (proto field sizes)
        - G703 # taint-analysis path traversal — paths are validated internally
        - G706 # taint-analysis log injection — log inputs are hex-only or controlled
    revive:
      rules:
        - name: exported
          severity: warning
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - exhaustruct
          - gosec
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
